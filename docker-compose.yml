services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      # Bound to loopback only - the Cloudflare Tunnel connects via
      # localhost on this same host, so nothing legitimate needs this
      # published more widely. Without the 127.0.0.1 prefix, Docker binds
      # to every interface (0.0.0.0/::) by default, making the app directly
      # reachable from the LAN and bypassing Cloudflare's protections and
      # this app's own IP-based rate limiting entirely.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Lets the container resolve host.docker.internal to the host machine -
    # needed to reach a locally-running LLM server (see LLM_API_BASE_URL).
    # Works on Linux Docker Engine 20.10+, not just Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
