<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Quest — Admin</title>
<link rel="stylesheet" href="/css/theme.css?v=9">
</head>
<body>
<div class="wrap">
  <header>
    <span class="flag">Restricted</span>
    <h1>Admin <span>Console</span></h1>
    <p class="sub">Manage every family on this instance</p>
  </header>
  <div class="card">
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="formError"></p>
      <button type="submit" class="submit-btn">Log In</button>
    </form>
  </div>
</div>
<script src="/js/api.js?v=9"></script>
<script src="/js/admin-login.js?v=9"></script>
</body>
</html>
