<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Quest — Who's Playing?</title>
<link rel="stylesheet" href="/css/theme.css?v=11">
<link rel="stylesheet" href="/css/game.css?v=11">
</head>
<body>
<div class="wrap">
  <header>
    <span class="flag" id="familyFlag">Ahoy!</span>
    <h1 id="screenTitle">Who's <span>Playing?</span></h1>
    <p class="sub" id="screenSub">Tap your avatar</p>
  </header>
  <div class="card">
    <p class="form-error" id="loadError"></p>

    <div id="screen-avatars" class="avatar-grid"></div>

    <div id="screen-pin" class="hidden">
      <button class="back-btn" id="backToAvatars" style="margin-bottom:16px;">← Not me</button>
      <div class="pin-display" id="pinDisplay">
        <span class="pin-dot"></span><span class="pin-dot"></span>
        <span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <p class="form-error" id="pinError"></p>
      <div class="keypad" id="pinKeypad"></div>
    </div>
  </div>
  <footer><a href="/play/index.html">← Different family code</a></footer>
</div>
<script src="/js/api.js?v=11"></script>
<script src="/js/play-family.js?v=11"></script>
</body>
</html>
