<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Quest — Parent Log In</title>
<link rel="stylesheet" href="/css/theme.css?v=12">
</head>
<body>
<div class="wrap">
  <header>
    <span class="flag">Welcome back!</span>
    <h1>Parent <span>Log In</span></h1>
    <p class="sub">Manage your family's quest</p>
  </header>
  <div class="card">
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="formError"></p>
      <button type="submit" class="submit-btn">Log In</button>
    </form>
    <p class="link-row">New here? <a href="/parent/signup.html">Create a family</a></p>
  </div>
  <footer><a href="/">← Back home</a></footer>
</div>
<script src="/js/api.js?v=12"></script>
<script src="/js/parent-login.js?v=12"></script>
</body>
</html>
